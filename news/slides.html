<!DOCTYPE html>
<html lang="en">
<head>
  <title>img</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
  <style>
  /* Make the image fully responsive */
  html, body {
      height: 100%;
      margin: 0;
  }
  .carousel,
  .carousel-inner,
  .carousel-item {
      height: 100%;
  }
  .carousel-item.active,
  .carousel-item-next,
  .carousel-item-prev {
      display: flex;
      align-items: center;
      justify-content: center;
  }
  .carousel-inner img {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 100%;
      object-fit: contain;
  }
  
  
  .border{ border-radius:3px;}
  
  
  </style>
</head>
<body>

<div id="carouselExampleFade" class="carousel slide carousel-fade border" data-ride="carousel">
  <div class="carousel-inner">
  
  

	  <div class="carousel-item active ">
      <img src="../img/research-area/battery1.jpg" alt=""/>
     
    </div>
    
	<div class="carousel-item  ">
    <img src="../img/research/p9.jpg" alt=""/> 
   
    
   
  
    </div>
	
    
   
     <div class="carousel-item ">
     <img src="../img/research/Picture4.jpg" alt=""/>
    </div>
     <div class="carousel-item ">
     <img src="../img/slides/flexslider/Picture1.jpg" alt=""/>
     
    </div>
     <div class="carousel-item ">
     <img src="../img/research/Thiru_JACERS.jpg" alt=""/>
     
    </div>
    <div class="carousel-item ">
      <img src="../img/research/p03.jpg" alt=""/>
    
    </div>
  </div>
  </div>
  <a class="carousel-control-prev" href="#carouselExampleFade" role="button" data-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true" style="background-color: cadetblue; border-radius: 10px; padding: 1px;"></span>
    <span class="sr-only">Previous</span>
  </a>
  <a class="carousel-control-next" href="#carouselExampleFade" role="button" data-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true" style="background-color: cadetblue; border-radius: 10px; padding: 1px;"></span>
    <span class="sr-only">Next</span>
  </a>
</div>

</body>
</html>
